# Project Context Template

Copy this file to `~/.config/opencode/patesi-memory/{project-name}/context.yaml` and fill in the values. Patesi creates this automatically during elicitation.

```yaml
# Project Context
# Auto-generated by Patesi during session start elicitation.

project_id: ""           # URL-safe identifier (e.g., "my-app", "seidor-project-xyz")
name: ""                 # Human-readable project name
mode: ""                 # seidor | personal | client
last_session: ""         # ISO 8601 date (e.g., "2026-08-25")

# Project metadata
tech_stack: ""           # e.g., "React + Node.js + PostgreSQL"
test_frameworks: ""      # e.g., "Jest (unit), Playwright (E2E)"
ci_cd_platform: ""       # e.g., "GitHub Actions"
testing_maturity: ""     # e.g., "Unit tests, no E2E"
team_setup: ""           # e.g., "1 QA engineer + devs own unit tests"
known_risk_areas: ""     # e.g., "Payment module, auth, data exports"
conventions: ""          # e.g., ".spec.ts files, @smoke/@regression tags"

# Seidor-specific fields (null if personal/client)
naq: ""                  # bajo | medio | alto | null
naq_score: null          # Calculated NAQ value (float)
naq_factors:
  criticidad: null       # 0-4
  visibilidad: null      # 0-4
  interoperabilidad: null # 0-4
  sensibilidad: null     # 0-4
  complejidad: null      # 0-4
tipologia: ""            # Primary tipologia (15 options)
tipologia_secundaria: "" # Secondary tipologia (optional)
delivery_target: ""      # basico | integrado | continuo | null
sqem_version: ""         # e.g., "v1.2"
```
