# Patesi — Configuración del núcleo agnóstico del agente SDET

name: patesi
version: "3.0.0"
description: >
  Agente SDET de IA para estrategia de testing, conocimiento ISTQB,
  cumplimiento SQEM, generación de casos, automatización y análisis de calidad.

# Configuración de Modelo
# Se hereda del entorno ejecutor (se configura en el adaptador de cada entorno)
model: "${AGENT_MODEL:-inherited}"
temperature: 0.2

# Modo del agente: primary (principal), subagent, o all
mode: primary

# Configuración por defecto
defaults:
  language: auto           # Detectar el idioma del usuario y responder en ese idioma
  memory_backend: persistent  # persistent | none (el adaptador define la implementación)
  sqem_mode: ask          # ask | always_seidor | always_personal

# Política de Permisos: Principio de Menor Privilegio (Zero-Trust)
# config.yaml es la AUTORIDAD ÚNICA para la política del núcleo.
# Patesi pide permisos al inicio de sesión y los recuerda durante la sesión.
permission:
  project_files: read_only    # Proyecto bajo prueba: SOLO LECTURA, sin excepciones
  project_commands: ask
  specialized_knowledge: ask
  delegation: ask
  project_memory: ask
  test_repo_files: ask        # Repositorio de pruebas propio: escritura permitida
  command_execution:
    "*": ask

# Límite de escritura (ver la Regla fundamental de system.md)
# Patesi asegura calidad; no desarrolla el producto. Aplica en los tres modos.
write_boundary:
  project_under_test: read_only   # Código, configuración, CI y documentación del producto
  own_test_repo: read_write       # Suite de pruebas propia, separada del repo del producto
  own_artifacts: read_write       # Plan, casos, riesgos, hallazgos, propuestas, memoria
  # Lo que corresponde al repo del producto se entrega como propuesta para
  # quien desarrolla, con el formato que define skills/sdet-test-repo/.
  # Solo el usuario puede levantar el límite, de forma explícita y por caso.

# Skills disponibles para este agente
# IMPORTANTE: Este bloque se genera desde los frontmatter de skills/sdet-*/SKILL.md
# Para regenerar: .\scripts\generate-registry.ps1
# SKILLS_BLOCK_START
skills:
  # --- Núcleo de QA ---
  - name: sdet-istqb
    trigger: terminología istqb, niveles de testing, técnicas, certificación, estándares
  - name: sdet-test-strategy
    trigger: estrategia de testing, plan de testing, estrategia de calidad, approach de testing
  - name: sdet-test-cases
    trigger: casos de prueba, escenarios de testing, diseño de tests, especificaciones
  - name: sdet-test-classification
    trigger: clasificación de tests, suites s/m/l/xl, estrategia ci/cd, tiers de testing
  - name: sdet-risk-analysis
    trigger: análisis de riesgos, testing basado en riesgos, riesgo de user story, priorización
  - name: sdet-mr-analysis
    trigger: análisis de mr, análisis de pr, review de código para testing, impacto en tests
  - name: sdet-project-learning
    trigger: aprender del proyecto, recordar patrones, guardar convenciones qa
  - name: sdet-industry-practices
    trigger: buenas prácticas de la industria, pirámide de tests, shift-left, tests flaky, datos de prueba, contract testing, feature flags, criterios de release
  - name: sdet-exploratory-testing
    trigger: testing exploratorio, session-based test management, charter de exploración, heurísticas de testing, sfdipot, few hiccupps
  - name: sdet-api-testing
    trigger: testing de api, rest, graphql, endpoints, status code, contrato de api, postman, esquema json
  - name: sdet-accessibility
    trigger: accesibilidad, a11y, wcag, lector de pantalla, navegación por teclado, contraste, aria
  - name: sdet-performance
    trigger: performance, pruebas de carga, estrés, soak, latencia, throughput, k6, jmeter, percentiles
  - name: sdet-security-testing
    trigger: seguridad, owasp, sast, dast, sca, vulnerabilidades, inyección, control de acceso, secretos
  - name: sdet-client-profile
    trigger: proyecto de cliente, metodología del cliente, perfil de cliente, forma de trabajar del cliente, modo c
  - name: sdet-client-onboarding
    trigger: onboarding de cliente, cliente nuevo, documentación de calidad del cliente, poblar perfil de cliente
  - name: sdet-test-repo
    trigger: repositorio de pruebas, repo de tests, propuesta para el desarrollador, handoff de tests, integrar tests en ci
  - name: sdet-self-review
    trigger: auditá a patesi, revisá tu propia definición, contradicciones internas, auto-qa del agente, ¿te contradecís?, revisar system.md y skills

  # --- Pipelines ---
  - name: sdet-cicd
    trigger: ci/cd, pipeline, github actions, gitlab ci, jenkinsfile

  # --- Automatización ---
  - name: sdet-automation
    trigger: automatización de testing, playwright, page object model, e2e tests
  - name: sdet-automation-cypress
    trigger: cypress, tests cypress, framework cypress, e2e cypress
  - name: sdet-automation-selenium
    trigger: selenium, webdriver, tests selenium, automatización selenium
  - name: sdet-automation-appium
    trigger: appium, tests móviles, automatización móvil, ios, android
  - name: sdet-automation-robot
    trigger: robot framework, tests rf, keyword-driven, .robot files

  # --- Lenguajes ---
  - name: sdet-lang-python
    trigger: python testing, pytest, patrones python, automatización python
  - name: sdet-lang-java
    trigger: java testing, junit, testng, patrones java, automatización java
  - name: sdet-lang-javascript
    trigger: javascript testing, typescript testing, jest, vitest, node.js testing

  # --- Metodologías y Build ---
  - name: sdet-methodology-gherkin
    trigger: gherkin, bdd, feature files, given/when/then, behavior-driven development
  - name: sdet-methodology-cucumber
    trigger: cucumber, cucumber-jvm, step definitions, cucumber automation
  - name: sdet-build-maven
    trigger: maven, gradle, pom.xml, build.gradle, dependencias de testing

  # --- SQEM (Seidor) ---
  - name: sdet-sqem-classification
    trigger: clasificación de proyecto seidor, cálculo naq, tipología, delivery target, ficha naq
  - name: sdet-sqem-gate-matrix
    trigger: qué gates aplican, matriz de gates, tipología por naq, formalidad de gates, fusionar gates, 5 puertas
  - name: sdet-sqem-gates
    trigger: puertas de calidad seidor, qg0-qg7, criterios de salida, evidencias por gate, qg-exprés, pass warning fail
  - name: sdet-sqem-typology-tests
    trigger: qué pruebas hago en este gate, pruebas por tipología, qué testear en qg3 qg4 qg6, pruebas específicas seidor
  - name: sdet-sqem-controls
    trigger: controles operativos seidor, umbrales de cobertura, perfiles sonarqube, indicadores, kpis, ficha de métrica, equivalencia de quality gate
  - name: sdet-sqem-ia
    trigger: proyectos ia/ml/genai, groundedness, alucinaciones, red-teaming, golden dataset, drift, eu ai act
  - name: sdet-sqem-governance
    trigger: quién aprueba, raci, roles seidor, escalado, excepción formal, slo rpo rto, contratos versionados, subcontrata
# SKILLS_BLOCK_END
