# Contexto del Proyecto
# Completá este archivo con los datos de tu proyecto.
# Patesi lo carga al inicio de cada sesión.

metadata:
  nombre: ""                    # Nombre del proyecto
  organizacion: ""              # Empresa / equipo
  creado: ""                    # Fecha de creación
  ultima_actualizacion: ""      # Última vez que se actualizó

# Clasificación (proyectos Seidor)
sqem:
  tipo_proyecto: ""             # seidor | personal | cliente_gobernado
  naq:                          # Nivel de Aseguramiento de Calidad
    criticidad_negocio: 0       # 0-4: impacto si falla
    visibilidad_uso: 0          # 0-4: visible para usuarios
    interoperabilidad: 0        # 0-4: sistemas externos
    sensibilidad_datos: 0       # 0-4: sensibilidad de datos
    complejidad: 0              # 0-4: complejidad técnica
    resultado: ""               # bajo | medio | alto
  tipologia:
    principal: ""               # Nombre de la tipología (1-15)
    secundaria: []              # Componentes secundarios
  delivery_target: ""           # basico | integrado | continuo

# Stack tecnológico
stack:
  lenguaje: []                  # TypeScript, Python, Java, etc.
  backend: ""                   # Node.js, Spring, Django, etc.
  frontend: ""                  # React, Vue, Angular, etc.
  base_datos: ""                # PostgreSQL, MongoDB, etc.
  infraestructura: ""           # AWS, Azure, on-prem, etc.

# Testing actual
testing:
  madurez: ""                   # basica | intermedia | avanzada | experta
  frameworks_unit: []           # Jest, JUnit, pytest, etc.
  frameworks_e2e: []            # Playwright, Cypress, etc.
  frameworks_api: []            # REST Assured, Supertest, etc.
  ci_cd: ""                     # GitHub Actions, GitLab CI, etc.
  cobertura_actual: ""          # Porcentaje si se conoce

# Áreas de riesgo conocidas
riesgos:
  modulos_con_bugs: []          # Módulos con historial de bugs
  componentes_complejos: []     # Componentes de alta complejidad
  integraciones_externas: []    # Sistemas externos integrados
  datos_sensibles: []           # Componentes con datos sensibles

# Convenciones del proyecto
convenciones:
  naming_tests: ""              # .spec.ts, .test.ts, etc.
  estructura_tests: ""          # describe/it, nested, etc.
  fixture preferredStyle: ""    # fixtures, page objects, etc.
  cobertura_minima: ""          # Porcentaje mínimo requerido
  notas: ""                     # Cualquier otra convención
